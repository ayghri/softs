# Example: BatchConfig with Hydra instantiation
# Use with: from hydra.utils import instantiate; config = instantiate(cfg.batch_config)

# Option 1: Full Hydra instantiation with _target_
batch_config:
  _target_: softs.BatchConfig
  specs:
    # Simple format (recommended) - TensorSpec created automatically
    - name: x
      shape: [512, 768]
      dtype: bfloat16

    - name: y
      shape: [512, 768]
      dtype: bfloat16

# Option 2: With explicit TensorSpec _target_ (more verbose but explicit)
