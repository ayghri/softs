[project]
name = "softs"
version = "0.1.0"
description = "Async on-the-fly training data generation pipeline for PyTorch"
authors = [
    {name = "Ayoub G.",email = "develop@ayghri.me"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ray[default] (>=2.40.0)",
    "torch (>=2.9.1,<3.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "pyyaml (>=6.0,<7.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
]
examples = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "transformers>=4.40",
    "datasets>=2.0",
    "tqdm",
]

[project.urls]
Documentation = "https://softs.readthedocs.io"
Repository = "https://github.com/ayghri/softs"

[tool.poetry]
packages = [{include = "softs", from = "./"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
