[tool.poetry]
name = "softs"
version = "0.1.2"
description = "Async on-the-fly training data generation pipeline for PyTorch"
authors = ["Ayoub G. <develop@ayghri.me>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "softs" }]
keywords = ["pytorch", "dataloader", "distillation", "zeromq", "shared-memory", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]

[tool.poetry.urls]
"Documentation" = "https://softs.readthedocs.io"
"Repository" = "https://github.com/ayghri/softs"


[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = ">=2.9.1,<3.0.0"
numpy = ">=1.26.0,<3.0.0"
pyyaml = ">=6.0,<7.0"
pyzmq = ">=26.0.0"
msgpack = ">=1.0.0"
pytest = { version = ">=9.0.2,<10.0.0", optional = true }
hydra-core = { version = ">=1.3", optional = true }
omegaconf = { version = ">=2.3", optional = true }
transformers = { version = ">=4.40", optional = true }
datasets = { version = ">=2.0", optional = true }
tqdm = { version = "*", optional = true }

[tool.poetry.extras]
dev = ["pytest"]
examples = ["hydra-core", "omegaconf", "transformers", "datasets", "tqdm"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
